<!doctype html>
<!--
  Source for public/og.png (1200x630 social preview) and public/apple-touch-icon.png.
  The name is drawn "mid-gust": per-letter weights follow the same wave as the live hero.
  Regenerate after editing:  npm run og
-->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Funnel Display"; font-weight: 300 800; src: url(../node_modules/@fontsource-variable/funnel-display/files/funnel-display-latin-wght-normal.woff2); }
  @font-face { font-family: "IBM Plex Mono"; src: url(../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2); }
  html, body { margin: 0; background: #ecebe7; }
  .og { position: relative; width: 1200px; height: 630px; box-sizing: border-box; padding: 0 72px 76px; display: flex; flex-direction: column; justify-content: flex-end; color: #121211; }
  .name { font-family: "Funnel Display"; font-size: 228px; line-height: .86; letter-spacing: -0.035em; margin: 0; }
  .name span { display: block; white-space: nowrap; }
  .top { position: absolute; top: 60px; left: 72px; right: 72px; display: flex; justify-content: space-between; font: 400 20px "IBM Plex Mono"; color: #5c5b57; }
  .top b { color: #ff4a1c; font-weight: 400; }
  .icon { width: 180px; height: 180px; background: #808080; position: relative; display: grid; place-items: center; }
  .cross { position: absolute; width: 78px; height: 78px; }
  .cross::before, .cross::after { content: ""; position: absolute; background: #111; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  .cross::before { width: 100%; height: 12px; } .cross::after { width: 12px; height: 100%; }
  .stim { position: absolute; width: 34px; height: 34px; right: 22px; top: 22px; background: #ff4a1c; }
</style>
</head>
<body>
  <div class="og" id="og">
    <div class="top"><span><b>+</b> nathanfisher.space</span><span>Researcher · Programmer · Game Developer</span></div>
    <h1 class="name" id="name"></h1>
  </div>
  <div class="icon" id="icon"><span class="cross"></span><span class="stim"></span></div>
  <script>
    if (location.hash === "#icon") document.getElementById("og").remove();
    else {
      // Same wave as the hero: base 340 + gaussian gust centred on letter `front`
      const words = ["Nathan", "Fisher"], front = 7.2, width = 2.4, amp = 400;
      let i = 0;
      document.getElementById("name").innerHTML = words.map(w =>
        "<span>" + [...w].map(ch => {
          const d = (i++ - front) / width;
          return `<i style="font-style:normal;font-weight:${Math.round(Math.min(800, 340 + amp * Math.exp(-d * d)))}">${ch}</i>`;
        }).join("") + "</span>").join("");
    }
  </script>
</body>
</html>
