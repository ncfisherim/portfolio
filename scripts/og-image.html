<!doctype html>
<!--
  Source for public/og.png (1200x630 social preview) and public/apple-touch-icon.png.
  Regenerate after editing:  npm run og
-->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Funnel Display"; font-weight: 300 800; src: url(../node_modules/@fontsource-variable/funnel-display/files/funnel-display-latin-wght-normal.woff2); }
  @font-face { font-family: "IBM Plex Mono"; src: url(../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2); }
  html, body { margin: 0; background: #ecebe7; }
  .og { width: 1200px; height: 630px; box-sizing: border-box; padding: 64px 72px; display: grid; grid-template-columns: 1fr 380px; gap: 64px; align-items: end; color: #121211; }
  .name { font: 500 26px "Funnel Display"; display: flex; gap: 12px; align-items: baseline; position: absolute; top: 60px; left: 72px; }
  .name b { color: #ff4a1c; font: 400 26px "IBM Plex Mono"; }
  .lede { font: 420 54px/1.06 "Funnel Display"; letter-spacing: -0.022em; margin: 0; }
  .lede u { text-decoration-thickness: 2px; text-underline-offset: 6px; text-decoration-color: rgb(18 18 17 / .35); }
  .stage { width: 380px; height: 380px; background: #808080; position: relative; display: grid; place-items: center; }
  .cross::before, .cross::after { content: ""; position: absolute; background: #111; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  .cross { position: absolute; width: 34px; height: 34px; }
  .cross::before { width: 100%; height: 4px; } .cross::after { width: 4px; height: 100%; }
  .stim { position: absolute; width: 84px; height: 84px; background: #ff4a1c; right: 40px; top: 40px; }
  .ms { position: absolute; bottom: 24px; left: 0; right: 0; text-align: center; font: 400 20px "IBM Plex Mono"; color: #111; }
  .url { position: absolute; bottom: 60px; left: 72px; font: 400 20px "IBM Plex Mono"; color: #5c5b57; }
  .icon { width: 180px; height: 180px; background: #808080; position: relative; display: grid; place-items: center; }
  .icon .cross { width: 78px; height: 78px; }
  .icon .cross::before { height: 12px; } .icon .cross::after { width: 12px; }
  .icon .stim { width: 34px; height: 34px; right: 22px; top: 22px; }
</style>
</head>
<body>
  <div class="og" id="og" style="position:relative">
    <div class="name"><b>+</b>Nathan Fisher</div>
    <div>
      <p class="lede">I teach myself the tools a problem needs, then build the thing <u>carefully</u>.</p>
      <div style="height:88px"></div>
    </div>
    <div class="stage"><span class="cross"></span><span class="stim"></span><span class="ms">tap when you see orange</span></div>
    <div class="url">nathanfisher.space</div>
  </div>
  <div class="icon" id="icon"><span class="cross"></span><span class="stim"></span></div>
  <script>if (location.hash === "#icon") document.getElementById("og").remove();</script>
</body>
</html>
