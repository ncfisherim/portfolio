<!doctype html>
<!--
  Source for public/og.png (1200x630 social preview) and public/apple-touch-icon.png.
  Regenerate after editing:  npm run og
-->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Instrument Serif"; src: url(../node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-normal.woff2); }
  @font-face { font-family: "Instrument Serif"; font-style: italic; src: url(../node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-italic.woff2); }
  @font-face { font-family: "JetBrains Mono"; src: url(../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-400-normal.woff2); }
  html, body { margin: 0; background: #0f0f0e; }
  .og { width: 1200px; height: 630px; box-sizing: border-box; padding: 80px 96px; display: flex; flex-direction: column; justify-content: space-between; color: #ecebe6; }
  .mono { font-family: "JetBrains Mono", monospace; font-size: 20px; letter-spacing: .2em; text-transform: uppercase; }
  .accent { color: #4fc4cc; }
  .muted { color: #8f8e88; }
  h1 { font-family: "Instrument Serif", serif; font-weight: 400; font-size: 168px; line-height: .9; margin: 0; letter-spacing: -.01em; }
  h1 em { color: #8f8e88; }
  .row { display: flex; justify-content: space-between; border-top: 1px solid #262624; padding-top: 28px; }
  .icon { width: 180px; height: 180px; background: #141414; display: grid; place-items: center; }
  .icon span { font-family: "Instrument Serif", serif; font-style: italic; font-size: 104px; color: #4fc4cc; line-height: 1; transform: translateY(-6px); }
</style>
</head>
<body>
  <div class="og" id="og">
    <div class="mono accent">Researcher · Programmer · Game Developer</div>
    <h1>Nathan<br><em>Fisher</em></h1>
    <div class="row mono muted"><span>nathanfisher.space</span><span class="accent">↗</span></div>
  </div>
  <div class="icon" id="icon"><span>nf</span></div>
  <script>if (location.hash === "#icon") document.getElementById("og").remove();</script>
</body>
</html>
